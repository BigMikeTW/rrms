# What:  RRMS CI pipeline. Runs four parallel jobs on GitHub-hosted runners:
#        (1) `secrets-scan` — gitleaks on full git history, (2) `lint-and-types`
#        — ESLint (max-warnings=0) + `tsc --noEmit`, (3) `bundle-scan` — Next
#        production build followed by `pnpm scan:bundle` to detect secrets
#        leaked into client chunks, (4) `semgrep` — OWASP Top Ten static
#        analysis. All four must be green before a PR can merge.
# Why:   Layer 4 of the project's defense-in-depth model (spec §6.7.4). Layers
#        1 (Claude Code hooks) and 2 (Husky pre-commit) live on developer
#        machines and can be bypassed with `git commit --no-verify` or by
#        disabling Claude. Layer 4 runs on GitHub's infrastructure, so it
#        cannot be bypassed by any local action — every push and PR is
#        re-checked from a clean checkout. Layer 4's enforcement on PRs is
#        made mandatory by the protected-branch rule on `main` (which lists
#        these jobs as required status checks). Layer 3 (pre-push hook) itself
#        is deferred to Phase 2 per spec §6.7.4.
# Where: GitHub-hosted `ubuntu-latest` runners (semgrep additionally uses the
#        `semgrep/semgrep` container). Triggered by GitHub on the events
#        below; results surface in the repo Actions tab and on PR pages.
# When:  Every push to `main`, every push to active development branches
#        (`feat/**`, `fix/**`, `docs/**`, `chore/**`), and every pull request
#        targeting `main`.

name: CI

# Defense-in-depth: explicit minimum permissions on GITHUB_TOKEN.
# All 4 jobs only need to read repo contents; none push, comment on PRs,
# or write to issues. Granting only `contents: read` reduces blast radius
# if any third-party action in the supply chain is compromised.
permissions:
  contents: read

# Cancel any in-progress run on the same branch when a new push lands.
# Saves CI minutes and keeps queue depth low; the latest commit is what
# matters. main keeps cancel-in-progress: false to verify every commit
# (intentional belt-and-suspenders for protected branch).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

on:
  pull_request:
    branches: [main]
  push:
    # Why: also run on feature/fix/docs/chore branches so developers get
    # feedback on every push during the 1-PR-per-Plan workflow, well before
    # the PR is opened. Without this, CI only fires once at PR-open time.
    branches:
      - main
      - "feat/**"
      - "fix/**"
      - "docs/**"
      - "chore/**"

jobs:
  secrets-scan:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      # Note: gitleaks-action@v2 reads `.gitleaks.toml` from the repo root
      # automatically; it does not expose a `config-path` input.
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint-and-types:
    name: ESLint + tsc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck

  bundle-scan:
    name: Client bundle scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm scan:bundle

  semgrep:
    name: semgrep OWASP
    runs-on: ubuntu-latest
    container:
      # Pinned image tag (no :latest) for reproducibility. The semgrep org
      # was renamed from `returntocorp` to `semgrep` upstream; both still
      # work but `semgrep/semgrep` is the canonical name. Bumped 1.86.0 →
      # 1.162.0 (Plan 2 Task 0 version research — 1.86.0 was ~76 minor
      # releases behind). Keep bumping this tag in a separate PR when
      # adopting a newer semgrep release so any ruleset-driven false
      # positives can be triaged in isolation.
      image: semgrep/semgrep:1.162.0
    steps:
      - uses: actions/checkout@v6
      - run: semgrep --config p/owasp-top-ten --error

  doc-audit:
    # Why: Phase 2A's audit-docs script becomes a hard CI gate per the
    # mini-audit discipline (feedback_per_plan_mini_audit.md). 0 errors
    # required; warnings allowed but flagged in PR review. Catches
    # ADR-ref drift, deprecated terms, package version drift, env-var
    # drift, broken markdown links, and Amendment-section structural
    # validation (added Phase 4 for ADR-0000 Amendment Policy).
    name: Doc audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit:docs

  dependency-audit:
    # Why: Per ADR-0134 #5 (Better Auth Phase 1 security configuration),
    # Round-3 source-code audit found 3 RRMS-relevant GHSA advisories on
    # better-auth alone (GHSA-vp58-j275-797x, GHSA-36rg-gfq2-3h56,
    # GHSA-hjpm-7mrm-26w8). Pinning ^1.6.10 includes those fixes, but
    # new advisories surface continuously — pnpm audit at high+ severity
    # catches them on every CI run rather than waiting for human review.
    # `--audit-level=high` matches the threshold ADR-0134 mandates;
    # moderate/low are not gated (they would be too noisy in early Phase 1).
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high --prod

  drizzle-push-ban:
    # Why: Per ADR-0017 + Round-2 Q3, Drizzle pgPolicy / RLS API is RC-stage
    # with multiple known bugs in `drizzle-kit push` path (issues #3504,
    # #4407, #4198, #3495). RRMS commits to `generate + migrate` only
    # (raw SQL files reviewed). This job greps the repo to ensure no
    # script / package.json / JS-TS file / CI workflow YAML accidentally
    # invokes `drizzle-kit push`. Fails the CI if any match found. The
    # grep scans *.yml / *.yaml too (so a future workflow can't slip a
    # `drizzle-kit push` step past this gate) but excludes ci.yml itself
    # to avoid self-matching on the error-message string below.
    name: Ban drizzle-kit push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Grep for drizzle-kit push invocations
        run: |
          # Scope the search to file types where the command could actually
          # be invoked: package.json scripts, shell scripts, JS/TS/MJS, and
          # CI workflow YAMLs (*.yml / *.yaml — a future workflow could shell
          # out to `drizzle-kit push` in a step). This workflow file (ci.yml)
          # is excluded via --exclude=ci.yml because its own error-message
          # string below contains the literal "drizzle-kit push" and would
          # otherwise self-match. Markdown / ADR / spec / plan files are
          # intentionally excluded — they may legitimately mention the ban
          # (e.g. ADR-0017 Phase 4 Additions in Plan 3). The .toml gitleaks
          # rule file is also fine to leave out of scope.
          MATCHES=$(grep -rEn \
            --include='*.json' --include='*.sh' --include='*.bash' \
            --include='*.ts' --include='*.tsx' --include='*.mts' \
            --include='*.js' --include='*.mjs' --include='*.cjs' \
            --include='*.yml' --include='*.yaml' \
            --exclude=ci.yml \
            --exclude-dir=.git --exclude-dir=node_modules \
            --exclude-dir=.next --exclude-dir=build \
            'drizzle-kit[[:space:]]+push' . || true)
          if [ -n "$MATCHES" ]; then
            echo "$MATCHES"
            echo "::error::drizzle-kit push is banned per ADR-0017 + Round-2 Q3 (RC-stage RLS bugs in pgPolicy push path). Use 'drizzle-kit generate' + 'drizzle-kit migrate' instead."
            exit 1
          fi
          echo "OK: no drizzle-kit push invocations found in executable files."
